[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rve2d-fibre"
version = "0.2.0"
description = "2D and 3D RVEs of long-fibre composite plies: geometry, meshing, linear homogenization and nonlinear (plasticity + cohesive interface) solves with a Python or a Julia (Ferrite.jl) engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Open Source Contributors"},
]
keywords = [
  "composites",
  "rve",
  "gmsh",
  "meshing",
  "microstructure",
  "homogenization",
  "ferrite",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-image>=0.26",
  "PyYAML>=6.0",
  "meshio>=5.3",
  "h5py>=3.8",  # XDMF export (the default mesh format)
]

[project.optional-dependencies]
gmsh = ["gmsh>=4.12"]
# Nonlinear RVE solve (J2 plasticity + cohesive interfaces). diffcohesive brings
# tensormesh-fem and torch-sla (sparse solvers, including cuDSS on GPUs).
nonlinear = [
  "torch>=2.1",
  "diffcohesive>=0.1.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/roysondsouza316/long-fibre-composite-rve-toolkit"
Issues = "https://github.com/roysondsouza316/long-fibre-composite-rve-toolkit/issues"

[project.scripts]
rve2d = "rve2d.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
# The Julia engine (FerriteRVE and DiffCohesive packages + entry script) ships with the wheel.
"rve2d.engines.julia" = [
  "run.jl",
  "FerriteRVE/Project.toml",
  "FerriteRVE/README.md",
  "FerriteRVE/src/*.jl",
  "FerriteRVE/test/*.jl",
  "DiffCohesive/Project.toml",
  "DiffCohesive/README.md",
  "DiffCohesive/src/*.jl",
  "DiffCohesive/test/*.jl",
  "DiffCohesive/test/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rve2d"]

[[tool.mypy.overrides]]
module = [
  "gmsh",
  "meshio",
  "scipy",
  "scipy.*",
  "skimage",
  "skimage.*",
  "tifffile",
  "yaml",
  "diffcohesive",
  "diffcohesive.*",
  "tensormesh",
  "tensormesh.*",
  "torch_sla",
  "torch_sla.*",
]
ignore_missing_imports = true
