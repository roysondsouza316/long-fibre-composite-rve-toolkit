mode: image
dimension: 2
image:
  image_path: examples/2d/image/sample_mask.pgm
  pixel_size: 0.01
  threshold: 0.5
  min_artifact_area_px: 4
  clear_border: false
  simplify_tolerance: 0.5
  periodic_compatible: false
mesh:
  element_size_min: 0.002
  element_size_max: 0.01
export:
  output_dir: outputs/2d/image/oriented_solve
  basename: image_2d_oriented_solve
  formats: ["msh", "xdmf"]
solver:
  enabled: true
  boundary_condition: dirichlet
  kinematics: plane_stress
  matrix_material_model: orthotropic
  matrix_e1: 5000000000.0
  matrix_e2: 3200000000.0
  matrix_g12: 1400000000.0
  matrix_nu12: 0.31
  matrix_material_angle_deg: 15.0
  fibre_material_model: orthotropic
  fibre_e1: 140000000000.0
  fibre_e2: 12000000000.0
  fibre_g12: 5000000000.0
  fibre_nu12: 0.22
  fibre_material_angle_deg: 30.0
  write_vtk: true
