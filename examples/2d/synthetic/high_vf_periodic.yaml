# Periodic 2D RVE at fibre volume fraction 0.60 (lengths in micrometres): 7 um fibres in a
# 63 um cell (62 fibres). Random sequential placement saturates near Vf 0.45-0.5, so this uses the
# overlap-relaxation packing, and periodic wrapping lets fibres cross the cell boundary instead
# of leaving a matrix-only band along the edges.
mode: synthetic
dimension: 2
synthetic:
  domain_width: 63.0
  domain_height: 63.0
  fibre_radius: 3.5
  target_volume_fraction: 0.60
  min_spacing: 0.35          # minimum fibre-to-fibre gap, about one element near fibres
  random_seed: 3
  periodic_compatible: true
  periodic_wrapping: true
  packing_algorithm: relaxation
  boundary_clearance: 0.35   # no near-tangent cuts of fibres by the cell faces
mesh:
  element_size_min: 0.35
  element_size_max: 1.0
export:
  output_dir: outputs/2d/synthetic/high_vf_periodic
  basename: synthetic_2d_high_vf_periodic
  formats: ["msh", "xdmf"]
solver:
  enabled: true
  boundary_condition: periodic
  kinematics: generalized_plane_strain   # UD cross-section: full 6x6 stiffness from the 2D mesh
  matrix_youngs_modulus: 3500000000.0
  matrix_poisson_ratio: 0.35
  fibre_youngs_modulus: 70000000000.0
  fibre_poisson_ratio: 0.2
  write_vtk: true
