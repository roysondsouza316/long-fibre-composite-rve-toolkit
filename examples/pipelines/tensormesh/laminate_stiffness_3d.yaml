# Laminate stiffness from a 3D RVE, TensorMesh engine (glass/epoxy; units mm, MPa).
#   RVE -> ply stiffness (linear homogenization, solid)
#       -> for every stacking sequence: ABD matrix, membrane and flexural engineering
#          constants (classical lamination theory) and the 3D effective stiffness
# For straight fibres the 2D route (laminate_stiffness_2d.yaml) gives the same ply at a
# fraction of the cost; the 3D route is there for 3D microstructures.
#   rve2d laminate examples/pipelines/tensormesh/laminate_stiffness_3d.yaml
# Edit stacking_sequences and rerun from the saved ply properties (no RVE solve):
#   rve2d laminate examples/pipelines/tensormesh/laminate_stiffness_3d.yaml \
#       --ply outputs/pipelines/tensormesh/laminate_stiffness_3d/ply/ply_properties.json
mode: synthetic
dimension: 3
synthetic:
  domain_width: 0.02          # 20 x 20 x 4 um box, 7 um fibres along z
  domain_height: 0.02
  domain_depth: 0.004
  fibre_radius: 0.0035
  target_volume_fraction: 0.30
  min_spacing: 0.0004
  edge_clearance: 0.0004
  random_seed: 5
  periodic_compatible: true
mesh:
  element_size_min: 0.0006
  element_size_max: 0.0015
  elements_per_circle: 24
  verbosity: 0
export:
  output_dir: outputs/pipelines/tensormesh/laminate_stiffness_3d
  basename: rve
  formats: ["msh"]
solver:                       # ply stiffness
  enabled: true
  engine: tensormesh
  kinematics: solid
  boundary_condition: periodic
  matrix_youngs_modulus: 3500.0
  matrix_poisson_ratio: 0.35
  fibre_youngs_modulus: 70000.0
  fibre_poisson_ratio: 0.2
  write_vtk: false
laminate:
  enabled: true
  ply_thickness: 0.125        # mm
  # [0/90/45] is unsymmetric (B != 0); [30/-60]s is unbalanced (shear-extension coupling)
  stacking_sequences: ["[0]8", "[90]8", "[0/90]2s", "[±45]2s", "[0/±45/90]s", "[0/90/45]",
                       "[30/-60]s"]
