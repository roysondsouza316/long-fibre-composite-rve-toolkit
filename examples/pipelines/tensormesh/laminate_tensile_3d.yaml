# Laminate pipeline from a 3D RVE, TensorMesh engine (glass/epoxy; units mm, MPa, N):
#   RVE -> ply stiffness (linear homogenization, solid)
#       -> ply curves (nonlinear RVE solves: transverse tension xx and in-plane shear xz)
#       -> stiffness and tensile test (stress, strain, elongation, force) of each laminate
# Needs pip install -e ".[gmsh,nonlinear]". For straight fibres the 2D route
# (laminate_tensile_2d.yaml) gives the same ply curves at a fraction of the cost.
#   rve2d laminate examples/pipelines/tensormesh/laminate_tensile_3d.yaml
# Edit stacking_sequences or tensile_test and rerun from the saved ply properties:
#   rve2d laminate examples/pipelines/tensormesh/laminate_tensile_3d.yaml \
#       --ply outputs/pipelines/tensormesh/laminate_tensile_3d/ply/ply_properties.json
mode: synthetic
dimension: 3
synthetic:
  domain_width: 0.02          # 20 x 20 x 4 um box, 7 um fibres along z
  domain_height: 0.02
  domain_depth: 0.004
  fibre_radius: 0.0035
  target_volume_fraction: 0.30
  min_spacing: 0.0004
  edge_clearance: 0.0004
  random_seed: 5
  periodic_compatible: true
mesh:
  element_size_min: 0.0006
  element_size_max: 0.0015
  elements_per_circle: 24
  verbosity: 0
export:
  output_dir: outputs/pipelines/tensormesh/laminate_tensile_3d
  basename: rve
  formats: ["msh"]
solver:                       # ply stiffness
  enabled: true
  engine: tensormesh
  kinematics: solid
  boundary_condition: periodic
  matrix_youngs_modulus: 3500.0
  matrix_poisson_ratio: 0.35
  fibre_youngs_modulus: 70000.0
  fibre_poisson_ratio: 0.2
  write_vtk: false
nonlinear:                    # ply curves: matrix plasticity + fibre/matrix debonding
  enabled: true
  engine: tensormesh
  boundary_condition: periodic
  matrix:
    youngs_modulus: 3500.0
    poisson_ratio: 0.35
    yield_stress: 60.0
    hardening_modulus: 300.0
  fibre:
    youngs_modulus: 70000.0
    poisson_ratio: 0.2
  interface:
    law: bilinear_mixed_mode
    penalty_stiffness: 1.0e8
    normal_strength: 50.0
    shear_strength: 75.0
    mode_i_toughness: 0.002
    mode_ii_toughness: 0.006
    bk_exponent: 1.45
    viscosity: 1.0e-4           # damage regularisation: carries the curves past debonding
laminate:
  enabled: true
  ply_thickness: 0.125        # mm
  stacking_sequences: ["[0]8", "[90]8", "[0/90]2s", "[±45]2s", "[0/±45/90]s"]
  longitudinal_tensile_strength: 600.0      # MPa (Vf 0.29); fibre failure is an input
  longitudinal_compressive_strength: 400.0
  transverse_max_strain: 0.03               # cover the ply strains of the test
  shear_max_strain: 0.08
  curve_steps: 40
  tensile_test:
    direction: x
    max_strain: 0.03
    steps: 300
    gauge_length: 150.0       # mm  -> elongation
    width: 25.0               # mm  -> force (N)
