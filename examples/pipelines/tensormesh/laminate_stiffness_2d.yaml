# Laminate stiffness from a 2D RVE, TensorMesh engine (glass/epoxy; units mm, MPa).
#   RVE -> ply stiffness (linear homogenization, generalized plane strain)
#       -> for every stacking sequence: ABD matrix, membrane and flexural engineering
#          constants (classical lamination theory) and the 3D effective stiffness
# Linear only (no PyTorch needed), a few seconds:
#   rve2d laminate examples/pipelines/tensormesh/laminate_stiffness_2d.yaml
# Edit stacking_sequences and rerun from the saved ply properties (no RVE solve):
#   rve2d laminate examples/pipelines/tensormesh/laminate_stiffness_2d.yaml \
#       --ply outputs/pipelines/tensormesh/laminate_stiffness_2d/ply/ply_properties.json
mode: synthetic
dimension: 2
synthetic:
  domain_width: 0.03          # 30 x 30 um window, 7 um fibres
  domain_height: 0.03
  fibre_radius: 0.0035
  target_volume_fraction: 0.40
  min_spacing: 0.0003
  edge_clearance: 0.0003
  random_seed: 11
  periodic_compatible: true
mesh:
  element_size_min: 0.0003
  element_size_max: 0.0015
  elements_per_circle: 40
  verbosity: 0
export:
  output_dir: outputs/pipelines/tensormesh/laminate_stiffness_2d
  basename: rve
  formats: ["msh"]
solver:                       # ply stiffness
  enabled: true
  engine: tensormesh
  kinematics: generalized_plane_strain
  boundary_condition: periodic
  matrix_youngs_modulus: 3500.0
  matrix_poisson_ratio: 0.35
  fibre_youngs_modulus: 70000.0
  fibre_poisson_ratio: 0.2
  write_vtk: false
laminate:
  enabled: true
  ply_thickness: 0.125        # mm
  # [0/90/45] is unsymmetric (B != 0); [30/-60]s is unbalanced (shear-extension coupling)
  stacking_sequences: ["[0]8", "[90]8", "[0/90]2s", "[±45]2s", "[0/±45/90]s", "[0/90/45]",
                       "[30/-60]s"]
