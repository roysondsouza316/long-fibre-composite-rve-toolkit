mode: synthetic
dimension: 3
synthetic:
  domain_width: 1.0
  domain_height: 1.0
  domain_depth: 0.3
  fibre_radius: 0.05
  target_volume_fraction: 0.2
  min_spacing: 0.005
  edge_clearance: 0.01
  random_seed: 7
  periodic_compatible: true
mesh:
  element_size_min: 0.03
  element_size_max: 0.08
export:
  output_dir: outputs/3d/synthetic/periodic_solve
  basename: synthetic_3d_periodic_solve
  formats: ["msh", "xdmf"]
solver:
  enabled: true
  boundary_condition: periodic
  kinematics: solid
  matrix_material_model: isotropic
  matrix_youngs_modulus: 3500000000.0
  matrix_poisson_ratio: 0.35
  fibre_material_model: isotropic
  fibre_youngs_modulus: 70000000000.0
  fibre_poisson_ratio: 0.2
  write_vtk: true
