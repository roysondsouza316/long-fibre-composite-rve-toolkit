# 3D periodic RVE (fibres along z) under transverse tension with cohesive fibre/matrix
# interfaces and matrix plasticity. Units: mm, MPa. Needs: pip install -e ".[gmsh,nonlinear]"
mode: synthetic
dimension: 3
synthetic:
  domain_width: 0.02
  domain_height: 0.02
  domain_depth: 0.004
  fibre_radius: 0.0035
  target_volume_fraction: 0.30
  min_spacing: 0.0004
  edge_clearance: 0.0004
  random_seed: 5
  periodic_compatible: true
mesh:
  element_size_min: 0.0006
  element_size_max: 0.0015
  elements_per_circle: 24
  verbosity: 0
export:
  output_dir: outputs/3d/synthetic/nonlinear_cohesive_plastic
  basename: synthetic_3d_nonlinear
  formats: ["msh"]
nonlinear:
  enabled: true
  kinematics: solid
  boundary_condition: periodic
  matrix:
    youngs_modulus: 3500.0
    poisson_ratio: 0.35
    yield_stress: 60.0
    hardening_modulus: 300.0
  fibre:
    youngs_modulus: 70000.0
    poisson_ratio: 0.2
  interface:
    law: bilinear_mixed_mode
    penalty_stiffness: 1.0e8
    normal_strength: 50.0
    shear_strength: 75.0
    mode_i_toughness: 0.002
    mode_ii_toughness: 0.006
    bk_exponent: 1.45
  load:
    type: uniaxial_stress
    component: xx
    max_strain: 0.012
    steps: 24
