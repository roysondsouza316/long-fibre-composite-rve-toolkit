# Periodic 3D RVE of fibres along z at fibre volume fraction 0.60 (lengths in micrometres):
# 7 um fibres in a 56 x 56 x 4 um cell (49 fibres). The cross-section is packed with the
# overlap-relaxation algorithm; periodic wrapping lets fibres cross the x and y faces.
mode: synthetic
dimension: 3
synthetic:
  domain_width: 56.0
  domain_height: 56.0
  domain_depth: 4.0
  fibre_radius: 3.5
  target_volume_fraction: 0.60
  min_spacing: 0.5           # minimum fibre-to-fibre gap, about one element near fibres
  random_seed: 5
  periodic_compatible: true
  periodic_wrapping: true
  packing_algorithm: relaxation
  boundary_clearance: 0.5    # no near-tangent cuts of fibres by the cell faces
mesh:
  element_size_min: 0.5
  element_size_max: 1.5
export:
  output_dir: outputs/3d/synthetic/high_vf_periodic
  basename: synthetic_3d_high_vf_periodic
  formats: ["msh", "xdmf"]
solver:
  enabled: true
  boundary_condition: periodic
  kinematics: solid
  matrix_material_model: isotropic
  matrix_youngs_modulus: 3500000000.0
  matrix_poisson_ratio: 0.35
  fibre_material_model: isotropic
  fibre_youngs_modulus: 70000000000.0
  fibre_poisson_ratio: 0.2
  write_vtk: true
