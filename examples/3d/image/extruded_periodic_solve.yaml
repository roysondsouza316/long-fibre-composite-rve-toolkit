mode: image
dimension: 3
image:
  image_path: examples/2d/image/sample_mask.pgm
  pixel_size: 0.01
  extrusion_depth: 0.2
  threshold: 0.5
  min_artifact_area_px: 4
  clear_border: false
  simplify_tolerance: 0.5
  periodic_compatible: true
mesh:
  element_size_min: 0.01
  element_size_max: 0.03
export:
  output_dir: outputs/3d/image/extruded_periodic_solve
  basename: image_3d_extruded_periodic_solve
  formats: ["msh", "xdmf"]
solver:
  enabled: true
  boundary_condition: periodic
  kinematics: solid
  matrix_material_model: isotropic
  matrix_youngs_modulus: 3500000000.0
  matrix_poisson_ratio: 0.35
  fibre_material_model: isotropic
  fibre_youngs_modulus: 70000000000.0
  fibre_poisson_ratio: 0.2
  write_vtk: true
